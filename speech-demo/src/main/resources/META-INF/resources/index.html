<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avatar Speech Demo</title>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js/+esm",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
    "talkinghead": "https://cdn.jsdelivr.net/gh/met4citizen/TalkingHead@1.7/modules/talkinghead.mjs"
} }
</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #1a1a2e; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; }
  header { padding: 1rem; text-align: center; border-bottom: 1px solid #333; }
  header h1 { font-size: 1.2rem; font-weight: 500; }
  #avatar-container { width: 100%; height: 300px; background: #111; position: relative; border-bottom: 1px solid #333; display: none; }
  #avatar-container.active { display: block; }
  #toggle-avatar { font-size: 0.8rem; color: #999; cursor: pointer; text-decoration: underline; }
  #chat { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 0.75rem; }
  .msg { max-width: 70%; padding: 0.75rem 1rem; border-radius: 12px; font-size: 0.95rem; line-height: 1.4; }
  .msg.user { align-self: flex-end; background: #2d5aa0; }
  .msg.avatar { align-self: flex-start; background: #333; }
  .msg.system { align-self: center; background: transparent; color: #888; font-size: 0.8rem; }
  #controls { display: flex; gap: 1rem; padding: 0.5rem 1rem; border-bottom: 1px solid #333; align-items: center; justify-content: center; }
  #controls label { font-size: 0.8rem; color: #999; }
  #controls select { padding: 0.3rem 0.5rem; border-radius: 6px; border: 1px solid #555; background: #2a2a3e; color: #e0e0e0; font-size: 0.85rem; }
  #input-bar { display: flex; gap: 0.5rem; padding: 1rem; border-top: 1px solid #333; }
  #input-bar input { flex: 1; padding: 0.75rem; border-radius: 8px; border: 1px solid #555; background: #2a2a3e; color: #e0e0e0; font-size: 1rem; }
  #input-bar input:focus { outline: none; border-color: #2d5aa0; }
  #input-bar button { padding: 0.75rem 1.5rem; border-radius: 8px; border: none; background: #2d5aa0; color: white; font-size: 1rem; cursor: pointer; }
  #input-bar button:disabled { opacity: 0.5; cursor: default; }
  #mic { padding: 0.75rem 1rem; border-radius: 8px; border: 2px solid #555; background: #2a2a3e; color: #e0e0e0; font-size: 1rem; cursor: pointer; transition: all 0.2s; }
  #mic:disabled { opacity: 0.5; cursor: default; }
  #mic.recording { background: #d64; border-color: #d64; color: white; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.7; } }
  #status { padding: 0.25rem 1rem; font-size: 0.75rem; color: #666; text-align: center; }
  #model-status { padding: 0.25rem 1rem; font-size: 0.75rem; color: #999; text-align: center; }
  #model-status .downloading { color: #d9a547; }
  #model-status .ready { color: #4a9; }
  #model-status .error { color: #d64; }
  #timing { display: none; margin: 0.5rem 1rem; padding: 0.5rem 0.75rem; background: #1e1e32; border-radius: 8px; font-size: 0.8rem; font-family: monospace; }
  #timing .bar { display: flex; gap: 2px; height: 20px; border-radius: 4px; overflow: hidden; margin-top: 0.25rem; }
  #timing .bar div { display: flex; align-items: center; justify-content: center; font-size: 0.7rem; color: white; }
  #timing .cleanup { background: #4a9; }
  #timing .llm { background: #d64; }
  #timing .tts { background: #58c; }
</style>
</head>
<body>
<header><h1>Avatar Speech Pipeline Demo</h1></header>
<div id="controls">
  <label>LLM: <select id="llmModel">
    <option value="claude-haiku-4-5@20251001">Haiku 4.5 (fast)</option>
    <option value="claude-sonnet-4@20250514">Sonnet 4</option>
    <option value="claude-opus-4@20250514">Opus 4</option>
  </select></label>
  <label>Voice: <select id="ttsModel">
    <optgroup label="Piper VITS — MOS ~3.7">
      <option value="lessac-medium">Lessac medium ▸ MOS 3.6</option>
      <option value="lessac-high">Lessac high ▸ MOS 3.9</option>
      <option value="amy">Amy (US ♀) ▸ MOS 3.7</option>
      <option value="ryan">Ryan (US ♂) ▸ MOS 3.8</option>
      <option value="jenny">Jenny (UK ♀) ▸ MOS 3.7</option>
    </optgroup>
    <optgroup label="Piper via sherpa — MOS ~3.7">
      <option value="sherpa:lessac-medium">Sherpa: Lessac ▸ MOS 3.6</option>
      <option value="sherpa:amy">Sherpa: Amy ▸ MOS 3.7</option>
      <option value="sherpa:ryan">Sherpa: Ryan ▸ MOS 3.8</option>
      <option value="sherpa:jenny">Sherpa: Jenny ▸ MOS 3.7</option>
    </optgroup>
    <optgroup label="Kokoro StyleTTS2 — MOS ~4.3">
      <option value="kokoro:af">Kokoro: AF (US ♀) ▸ MOS 4.3</option>
      <option value="kokoro:af_bella">Kokoro: Bella (US ♀) ▸ MOS 4.2</option>
      <option value="kokoro:af_sarah">Kokoro: Sarah (US ♀) ▸ MOS 4.3</option>
      <option value="kokoro:am_adam">Kokoro: Adam (US ♂) ▸ MOS 4.2</option>
      <option value="kokoro:am_michael">Kokoro: Michael (US ♂) ▸ MOS 4.1</option>
      <option value="kokoro:bf_emma">Kokoro: Emma (UK ♀) ▸ MOS 4.3</option>
      <option value="kokoro:bm_george">Kokoro: George (UK ♂) ▸ MOS 4.2</option>
    </optgroup>
  </select></label>
  <label>Speed: <input id="speed" type="range" min="0.6" max="1.4" step="0.05" value="0.9" style="width:80px;vertical-align:middle"> <span id="speedVal">0.9x</span></label>
</div>
<div style="text-align:center;padding:0.25rem"><span id="toggle-avatar">Show 3D Avatar</span></div>
<div id="avatar-container"></div>
<div id="model-status"></div>
<div id="status">Connecting...</div>
<div id="timing"><span id="timing-text"></span><div class="bar" id="timing-bar"></div></div>
<div id="chat"></div>
<div id="input-bar">
  <button id="mic" disabled title="Hold to talk">Mic</button>
  <input id="msg" type="text" placeholder="Type a message..." autocomplete="off" disabled>
  <button id="send" disabled>Send</button>
</div>

<script type="module">
import { TalkingHead } from "talkinghead";

const chat = document.getElementById('chat');
const msgInput = document.getElementById('msg');
const sendBtn = document.getElementById('send');
const status = document.getElementById('status');
const micBtn = document.getElementById('mic');
const avatarContainer = document.getElementById('avatar-container');
const toggleAvatar = document.getElementById('toggle-avatar');
let ws;
let audioCtx;
let head = null;
let pendingVisemes = null;
let micStream = null;
let micProcessor = null;
let micSource = null;
let recording = false;

function addMessage(text, cls) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function connect() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(proto + '//' + location.host + '/ws/avatar');

  ws.onopen = () => {
    status.textContent = 'Connected';
    msgInput.disabled = false;
    sendBtn.disabled = false;
    micBtn.disabled = false;
    addMessage('Connected — type a message or hold Mic to talk.', 'system');
  };

  ws.onmessage = (evt) => {
    addMessage('DEBUG msg: type=' + typeof evt.data + ' constructor=' + evt.data.constructor.name + ' len=' + (evt.data.length || evt.data.size || '?'), 'system');
    if (typeof evt.data === 'string') {
      const msg = JSON.parse(evt.data);
      switch (msg.type) {
        case 'transcript':
          addMessage(msg.text, 'user');
          break;
        case 'response':
          addMessage(msg.text, 'avatar');
          break;
        case 'phonemes':
          var count = msg.data ? msg.data.length : 0;
          var totalMs = count > 0 ? msg.data[msg.data.length - 1].endMs : 0;
          addMessage('Visemes: ' + count + ' frames, ' + totalMs + 'ms', 'system');
          if (msg.data && msg.data.length > 0) {
            pendingVisemes = msg.data;
          }
          break;
        case 'timing':
          showTiming(msg);
          break;
        case 'error':
          addMessage('Error: ' + msg.message, 'system');
          break;
        case 'partial':
          status.textContent = 'Hearing: ' + msg.text;
          break;
      }
    } else {
      addMessage('DEBUG: binary frame received, size=' + evt.data.size, 'system');
      playAudio(evt.data);
    }
  };

  ws.onclose = () => {
    status.textContent = 'Disconnected — reconnecting...';
    msgInput.disabled = true;
    sendBtn.disabled = true;
    micBtn.disabled = true;
    stopRecording();
    setTimeout(connect, 2000);
  };

  ws.onerror = () => {
    status.textContent = 'Connection error';
  };
}

function sendText() {
  const text = msgInput.value.trim();
  if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
  const llmModel = document.getElementById('llmModel').value;
  const ttsModel = document.getElementById('ttsModel').value;
  ws.send(JSON.stringify({ type: 'text', text: text, llmModel: llmModel, ttsModel: ttsModel }));
  msgInput.value = '';
  status.textContent = 'Processing...';
}

var audioQueue = [];
var audioPlaying = false;

async function playAudio(blob) {
  try {
    if (!audioCtx) audioCtx = new AudioContext();
    const arrayBuf = await blob.arrayBuffer();
    const audioBuf = await audioCtx.decodeAudioData(arrayBuf);

    addMessage('DEBUG playAudio: head=' + (head ? 'yes' : 'no') + ' visemes=' + (pendingVisemes ? pendingVisemes.length : 'null'), 'system');
    if (head && pendingVisemes) {
      var visemes = pendingVisemes.map(function(v) { return v.viseme; });
      var vtimes = pendingVisemes.map(function(v) { return v.startMs; });
      var vdurations = pendingVisemes.map(function(v) { return v.endMs - v.startMs; });
      pendingVisemes = null;
      var speakData = { audio: audioBuf, visemes: visemes, vtimes: vtimes, vdurations: vdurations };
      setTimeout(function() {
        try {
          head.speakAudio(speakData);
          addMessage('Lip-sync: ' + visemes.length + ' visemes, ' + audioBuf.duration.toFixed(1) + 's audio, speaking=' + head.isSpeaking, 'system');
        } catch (e) {
          addMessage('speakAudio error: ' + e.message, 'system');
        }
      }, 0);
      status.textContent = 'Speaking...';
      return;
    } else if (head) {
      addMessage('No visemes for audio chunk (head=' + !!head + ')', 'system');
    }

    audioQueue.push(audioBuf);
    if (!audioPlaying) playNext();
  } catch (e) {
    addMessage('Audio playback error: ' + e.message, 'system');
    status.textContent = 'Ready';
  }
}

function playNext() {
  if (audioQueue.length === 0) { audioPlaying = false; status.textContent = 'Ready'; return; }
  audioPlaying = true;
  var audioBuf = audioQueue.shift();
  var source = audioCtx.createBufferSource();
  source.buffer = audioBuf;
  var rate = parseFloat(document.getElementById('speed').value);
  source.playbackRate.value = rate;
  source.connect(audioCtx.destination);
  source.start();
  status.textContent = 'Playing (' + audioQueue.length + ' queued)';
  source.onended = playNext;
}

function showTiming(t) {
  const el = document.getElementById('timing');
  const txt = document.getElementById('timing-text');
  const bar = document.getElementById('timing-bar');
  el.style.display = 'block';
  txt.textContent = 'Cleanup: ' + t.cleanupMs + 'ms | LLM: ' + t.llmMs + 'ms | TTS: ' + t.ttsMs + 'ms | Total: ' + t.totalMs + 'ms';
  const total = t.totalMs || 1;
  bar.innerHTML = '<div class="cleanup" style="flex:' + t.cleanupMs + '">' + (t.cleanupMs > 50 ? t.cleanupMs + 'ms' : '') + '</div>'
    + '<div class="llm" style="flex:' + t.llmMs + '">' + t.llmMs + 'ms</div>'
    + '<div class="tts" style="flex:' + t.ttsMs + '">' + t.ttsMs + 'ms</div>';
}

document.getElementById('speed').addEventListener('input', function() {
  document.getElementById('speedVal').textContent = this.value + 'x';
});

var audioFrameCount = 0;

async function startRecording() {
  if (recording) return;
  console.log('[MIC] startRecording called');
  try {
    if (!audioCtx) audioCtx = new AudioContext();
    console.log('[MIC] AudioContext sampleRate:', audioCtx.sampleRate);
    micStream = await navigator.mediaDevices.getUserMedia({ audio: { sampleRate: 16000, channelCount: 1, echoCancellation: true, noiseSuppression: true } });
    micSource = audioCtx.createMediaStreamSource(micStream);
    micProcessor = audioCtx.createScriptProcessor(4096, 1, 1);
    audioFrameCount = 0;
    micProcessor.onaudioprocess = function(e) {
      if (!recording || !ws || ws.readyState !== WebSocket.OPEN) return;
      var input = e.inputBuffer.getChannelData(0);
      var resampled = resampleTo16k(input, audioCtx.sampleRate);
      var buf = new ArrayBuffer(resampled.length * 4);
      new Float32Array(buf).set(resampled);
      ws.send(buf);
      audioFrameCount++;
    };
    micSource.connect(micProcessor);
    micProcessor.connect(audioCtx.destination);
    var llm = document.getElementById('llmModel').value;
    var tts = document.getElementById('ttsModel').value;
    ws.send(JSON.stringify({ type: 'start', sampleRate: 16000, llmModel: llm, ttsModel: tts }));
    console.log('[MIC] sent START, mic active');
    recording = true;
    micBtn.classList.add('recording');
    micBtn.textContent = 'Recording...';
    status.textContent = 'Listening...';
  } catch (e) {
    console.error('[MIC] error:', e);
    addMessage('Microphone error: ' + e.message, 'system');
  }
}

function stopRecording() {
  if (!recording) return;
  console.log('[MIC] stopRecording called, frames sent:', audioFrameCount);
  micBtn.classList.remove('recording');
  micBtn.textContent = 'Finishing...';
  micBtn.disabled = true;
  status.textContent = 'Capturing final audio...';
  setTimeout(function() {
    recording = false;
    console.log('[MIC] sending STOP, total frames:', audioFrameCount);
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: 'stop' }));
    }
    status.textContent = 'Processing speech...';
    micBtn.textContent = 'Mic';
    if (micProcessor) { micProcessor.disconnect(); micProcessor = null; }
    if (micSource) { micSource.disconnect(); micSource = null; }
    if (micStream) { micStream.getTracks().forEach(function(t) { t.stop(); }); micStream = null; }
    micBtn.disabled = false;
  }, 500);
}

function resampleTo16k(input, fromRate) {
  if (fromRate === 16000) return input;
  var ratio = fromRate / 16000;
  var len = Math.round(input.length / ratio);
  var out = new Float32Array(len);
  for (var i = 0; i < len; i++) {
    out[i] = input[Math.round(i * ratio)];
  }
  return out;
}

micBtn.addEventListener('click', function() {
  if (recording) { stopRecording(); } else { startRecording(); }
});

sendBtn.addEventListener('click', sendText);
msgInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendText();
});

connect();

var modelStatusEl = document.getElementById('model-status');
var ttsSelect = document.getElementById('ttsModel');
var modelPollTimer = null;

function pollModelStatus() {
  fetch('/api/models/status')
    .then(r => r.json())
    .then(data => {
      var total = Object.keys(data).length;
      var ready = 0;
      var downloading = 0;
      var errors = 0;
      for (var key in data) {
        if (data[key] === 'READY') ready++;
        else if (data[key] === 'DOWNLOADING') downloading++;
        else if (data[key] === 'ERROR') errors++;
      }

      for (var i = 0; i < ttsSelect.options.length; i++) {
        var opt = ttsSelect.options[i];
        var st = data[opt.value];
        opt.disabled = st !== 'READY';
        if (st === 'DOWNLOADING') opt.text = opt.text.replace(/ \(downloading\.\.\.\)$/, '') + ' (downloading...)';
        else opt.text = opt.text.replace(/ \(downloading\.\.\.\)$/, '');
      }

      if (ready === total) {
        modelStatusEl.innerHTML = '<span class="ready">All voice models ready</span>';
        clearInterval(modelPollTimer);
        setTimeout(function() { modelStatusEl.style.display = 'none'; }, 3000);
      } else if (downloading > 0) {
        modelStatusEl.innerHTML = '<span class="downloading">Downloading voice models: ' + ready + '/' + total + ' ready</span>';
      } else if (errors > 0) {
        modelStatusEl.innerHTML = '<span class="error">Model errors: ' + errors + '/' + total + '</span>';
        if (ready + errors === total) clearInterval(modelPollTimer);
      }
    })
    .catch(function() {});
}

modelPollTimer = setInterval(pollModelStatus, 2000);
pollModelStatus();

toggleAvatar.addEventListener('click', async function() {
  if (avatarContainer.classList.contains('active')) {
    avatarContainer.classList.remove('active');
    toggleAvatar.textContent = 'Show 3D Avatar';
    return;
  }
  avatarContainer.classList.add('active');
  toggleAvatar.textContent = 'Hide 3D Avatar';
  if (!head) {
    try {
      addMessage('Loading 3D avatar...', 'system');
      head = new TalkingHead(avatarContainer, {
        ttsEndpoint: null,
        lipsyncModules: ['en'],
        cameraView: 'head',
        cameraRotateEnable: true,
        cameraZoomEnable: true,
        cameraPanEnable: true
      });
      await head.showAvatar({
        url: './avatar.glb',
        body: 'F',
        avatarMood: 'neutral',
        lipsyncLang: 'en'
      });
      window._head = head;
      var scene = head.scene || head._scene;
      var visemeTargets = [];
      if (scene) {
        scene.traverse(function(o) {
          if (o.morphTargetDictionary) {
            var keys = Object.keys(o.morphTargetDictionary);
            var vis = keys.filter(function(k) { return k.startsWith('viseme'); });
            visemeTargets.push(o.name + ': ' + (vis.length ? vis.join(',') : 'NO visemes (' + keys.length + ' targets: ' + keys.slice(0,5).join(',') + '...)'));
          }
        });
      }
      addMessage('3D avatar ready. Morph targets: ' + (visemeTargets.length ? visemeTargets.join(' | ') : 'none found (scene=' + !!scene + ')'), 'system');
    } catch (e) {
      addMessage('Avatar load error: ' + e.message, 'system');
      head = null;
    }
  }
});
</script>
</body>
</html>
