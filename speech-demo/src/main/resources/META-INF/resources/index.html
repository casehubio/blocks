<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avatar Speech Demo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #1a1a2e; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; }
  header { padding: 1rem; text-align: center; border-bottom: 1px solid #333; }
  header h1 { font-size: 1.2rem; font-weight: 500; }
  #chat { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 0.75rem; }
  .msg { max-width: 70%; padding: 0.75rem 1rem; border-radius: 12px; font-size: 0.95rem; line-height: 1.4; }
  .msg.user { align-self: flex-end; background: #2d5aa0; }
  .msg.avatar { align-self: flex-start; background: #333; }
  .msg.system { align-self: center; background: transparent; color: #888; font-size: 0.8rem; }
  #controls { display: flex; gap: 1rem; padding: 0.5rem 1rem; border-bottom: 1px solid #333; align-items: center; justify-content: center; }
  #controls label { font-size: 0.8rem; color: #999; }
  #controls select { padding: 0.3rem 0.5rem; border-radius: 6px; border: 1px solid #555; background: #2a2a3e; color: #e0e0e0; font-size: 0.85rem; }
  #input-bar { display: flex; gap: 0.5rem; padding: 1rem; border-top: 1px solid #333; }
  #input-bar input { flex: 1; padding: 0.75rem; border-radius: 8px; border: 1px solid #555; background: #2a2a3e; color: #e0e0e0; font-size: 1rem; }
  #input-bar input:focus { outline: none; border-color: #2d5aa0; }
  #input-bar button { padding: 0.75rem 1.5rem; border-radius: 8px; border: none; background: #2d5aa0; color: white; font-size: 1rem; cursor: pointer; }
  #input-bar button:disabled { opacity: 0.5; cursor: default; }
  #status { padding: 0.25rem 1rem; font-size: 0.75rem; color: #666; text-align: center; }
  #timing { display: none; margin: 0.5rem 1rem; padding: 0.5rem 0.75rem; background: #1e1e32; border-radius: 8px; font-size: 0.8rem; font-family: monospace; }
  #timing .bar { display: flex; gap: 2px; height: 20px; border-radius: 4px; overflow: hidden; margin-top: 0.25rem; }
  #timing .bar div { display: flex; align-items: center; justify-content: center; font-size: 0.7rem; color: white; }
  #timing .cleanup { background: #4a9; }
  #timing .llm { background: #d64; }
  #timing .tts { background: #58c; }
</style>
</head>
<body>
<header><h1>Avatar Speech Pipeline Demo</h1></header>
<div id="controls">
  <label>LLM: <select id="llmModel">
    <option value="claude-haiku-4-5@20251001">Haiku 4.5 (fast)</option>
    <option value="claude-sonnet-4@20250514">Sonnet 4</option>
    <option value="claude-opus-4@20250514">Opus 4</option>
  </select></label>
  <label>Voice: <select id="ttsModel">
    <option value="lessac-medium">Lessac (medium)</option>
    <option value="lessac-high">Lessac (high)</option>
    <option value="amy">Amy (US female)</option>
    <option value="ryan">Ryan (US male)</option>
    <option value="jenny">Jenny (UK female)</option>
  </select></label>
  <label>Speed: <input id="speed" type="range" min="0.6" max="1.4" step="0.05" value="0.9" style="width:80px;vertical-align:middle"> <span id="speedVal">0.9x</span></label>
</div>
<div id="status">Connecting...</div>
<div id="timing"><span id="timing-text"></span><div class="bar" id="timing-bar"></div></div>
<div id="chat"></div>
<div id="input-bar">
  <input id="msg" type="text" placeholder="Type a message..." autocomplete="off" disabled>
  <button id="send" disabled>Send</button>
</div>

<script>
const chat = document.getElementById('chat');
const msgInput = document.getElementById('msg');
const sendBtn = document.getElementById('send');
const status = document.getElementById('status');
let ws;
let audioCtx;

function addMessage(text, cls) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function connect() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(proto + '//' + location.host + '/ws/avatar');

  ws.onopen = () => {
    status.textContent = 'Connected';
    msgInput.disabled = false;
    sendBtn.disabled = false;
    addMessage('Connected — type a message to talk to the avatar.', 'system');
  };

  ws.onmessage = (evt) => {
    if (typeof evt.data === 'string') {
      const msg = JSON.parse(evt.data);
      switch (msg.type) {
        case 'transcript':
          addMessage(msg.text, 'user');
          break;
        case 'response':
          addMessage(msg.text, 'avatar');
          break;
        case 'phonemes':
          const count = msg.data ? msg.data.length : 0;
          const totalMs = count > 0 ? msg.data[msg.data.length - 1].endMs : 0;
          addMessage('Visemes: ' + count + ' frames, ' + totalMs + 'ms', 'system');
          break;
        case 'timing':
          showTiming(msg);
          break;
        case 'error':
          addMessage('Error: ' + msg.message, 'system');
          break;
        case 'partial':
          status.textContent = 'Hearing: ' + msg.text;
          break;
      }
    } else {
      // Binary frame = TTS audio (WAV)
      playAudio(evt.data);
    }
  };

  ws.onclose = () => {
    status.textContent = 'Disconnected — reconnecting...';
    msgInput.disabled = true;
    sendBtn.disabled = true;
    setTimeout(connect, 2000);
  };

  ws.onerror = () => {
    status.textContent = 'Connection error';
  };
}

function sendText() {
  const text = msgInput.value.trim();
  if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
  const llmModel = document.getElementById('llmModel').value;
  const ttsModel = document.getElementById('ttsModel').value;
  ws.send(JSON.stringify({ type: 'text', text: text, llmModel: llmModel, ttsModel: ttsModel }));
  msgInput.value = '';
  status.textContent = 'Processing...';
}

var audioQueue = [];
var audioPlaying = false;

async function playAudio(blob) {
  try {
    if (!audioCtx) audioCtx = new AudioContext();
    const arrayBuf = await blob.arrayBuffer();
    const audioBuf = await audioCtx.decodeAudioData(arrayBuf);
    audioQueue.push(audioBuf);
    if (!audioPlaying) playNext();
  } catch (e) {
    addMessage('Audio playback error: ' + e.message, 'system');
    status.textContent = 'Ready';
  }
}

function playNext() {
  if (audioQueue.length === 0) { audioPlaying = false; status.textContent = 'Ready'; return; }
  audioPlaying = true;
  var audioBuf = audioQueue.shift();
  var source = audioCtx.createBufferSource();
  source.buffer = audioBuf;
  var rate = parseFloat(document.getElementById('speed').value);
  source.playbackRate.value = rate;
  source.connect(audioCtx.destination);
  source.start();
  status.textContent = 'Playing (' + audioQueue.length + ' queued)';
  source.onended = playNext;
}

function showTiming(t) {
  const el = document.getElementById('timing');
  const txt = document.getElementById('timing-text');
  const bar = document.getElementById('timing-bar');
  el.style.display = 'block';
  txt.textContent = 'Cleanup: ' + t.cleanupMs + 'ms | LLM: ' + t.llmMs + 'ms | TTS: ' + t.ttsMs + 'ms | Total: ' + t.totalMs + 'ms';
  const total = t.totalMs || 1;
  bar.innerHTML = '<div class="cleanup" style="flex:' + t.cleanupMs + '">' + (t.cleanupMs > 50 ? t.cleanupMs + 'ms' : '') + '</div>'
    + '<div class="llm" style="flex:' + t.llmMs + '">' + t.llmMs + 'ms</div>'
    + '<div class="tts" style="flex:' + t.ttsMs + '">' + t.ttsMs + 'ms</div>';
}

document.getElementById('speed').addEventListener('input', function() {
  document.getElementById('speedVal').textContent = this.value + 'x';
});

sendBtn.addEventListener('click', sendText);
msgInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendText();
});

connect();
</script>
</body>
</html>
