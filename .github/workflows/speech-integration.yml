name: Speech Integration Tests

on:
  push:
    branches: [main]
    paths: ['speech-sherpa/**', 'speech-api/**']
  pull_request:
    branches: [main]
    paths: ['speech-sherpa/**', 'speech-api/**']
  workflow_dispatch:

permissions:
  contents: read

env:
  SHERPA_VERSION: '1.13.6'
  WHISPER_MODEL: 'sherpa-onnx-whisper-tiny'

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: 'temurin'
          cache: maven

      - name: Configure Maven for GitHub Packages
        uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: 'temurin'
          server-id: github-casehubio
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Unit tests (no native lib)
        run: mvn --batch-mode test -pl speech-api,speech-sherpa -am
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  integration-tests:
    needs: unit-tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            lib-archive: sherpa-onnx-v1.13.6-linux-x86_64-shared-cpu-lib.tar.bz2
            lib-strip: 2
            lib-ext: so

          - os: macos-latest
            platform: osx-arm64
            lib-archive: sherpa-onnx-v1.13.6-osx-arm64-shared-lib.tar.bz2
            lib-strip: 2
            lib-ext: dylib

          - os: windows-latest
            platform: win-x64
            lib-archive: sherpa-onnx-v1.13.6-win-x64-shared-MD-Release-lib.tar.bz2
            lib-strip: 2
            lib-ext: dll

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: 'temurin'
          cache: maven

      - name: Configure Maven for GitHub Packages
        uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: 'temurin'
          server-id: github-casehubio
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Cache native lib
        id: cache-native
        uses: actions/cache@v4
        with:
          path: ~/.casehub/native/sherpa-onnx
          key: sherpa-onnx-${{ env.SHERPA_VERSION }}-${{ matrix.platform }}

      - name: Install native lib (unix)
        if: steps.cache-native.outputs.cache-hit != 'true' && runner.os != 'Windows'
        run: |
          mkdir -p ~/.casehub/native/sherpa-onnx/${{ env.SHERPA_VERSION }}/${{ matrix.platform }}
          curl -sL https://github.com/k2-fsa/sherpa-onnx/releases/download/v${{ env.SHERPA_VERSION }}/${{ matrix.lib-archive }} | \
            tar xj --strip-components=${{ matrix.lib-strip }} \
            -C ~/.casehub/native/sherpa-onnx/${{ env.SHERPA_VERSION }}/${{ matrix.platform }}/

      - name: Install native lib (windows)
        if: steps.cache-native.outputs.cache-hit != 'true' && runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p ~/.casehub/native/sherpa-onnx/${{ env.SHERPA_VERSION }}/${{ matrix.platform }}
          curl -sL https://github.com/k2-fsa/sherpa-onnx/releases/download/v${{ env.SHERPA_VERSION }}/${{ matrix.lib-archive }} -o native.tar.bz2
          tar xjf native.tar.bz2
          cp sherpa-onnx-v${{ env.SHERPA_VERSION }}-*/lib/*.${{ matrix.lib-ext }} \
            ~/.casehub/native/sherpa-onnx/${{ env.SHERPA_VERSION }}/${{ matrix.platform }}/

      - name: Cache whisper model
        id: cache-model
        uses: actions/cache@v4
        with:
          path: /tmp/${{ env.WHISPER_MODEL }}
          key: whisper-model-tiny

      - name: Download whisper model
        if: steps.cache-model.outputs.cache-hit != 'true'
        shell: bash
        run: |
          curl -sL https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/${{ env.WHISPER_MODEL }}.tar.bz2 | \
            tar xj -C /tmp/

      - name: Integration tests
        shell: bash
        run: |
          mvn --batch-mode test -pl speech-sherpa -am \
            -Dsherpa.model.dir=/tmp/${{ env.WHISPER_MODEL }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify native lib loaded
        if: always()
        shell: bash
        run: ls -la ~/.casehub/native/sherpa-onnx/${{ env.SHERPA_VERSION }}/${{ matrix.platform }}/
