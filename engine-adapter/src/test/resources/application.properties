# casehub-blocks-engine-adapter integration tests — in-memory persistence, no Docker.

quarkus.http.test-port=0
quarkus.quartz.store-type=ram

# CDI indexing for library JARs
quarkus.index-dependency.engine-common.group-id=io.casehub
quarkus.index-dependency.engine-common.artifact-id=casehub-engine-common
quarkus.index-dependency.engine.group-id=io.casehub
quarkus.index-dependency.engine.artifact-id=casehub-engine
quarkus.index-dependency.scheduler-quartz.group-id=io.casehub
quarkus.index-dependency.scheduler-quartz.artifact-id=casehub-engine-scheduler-quartz
quarkus.index-dependency.persistence-memory.group-id=io.casehub
quarkus.index-dependency.persistence-memory.artifact-id=casehub-engine-persistence-memory
quarkus.index-dependency.cbr-inmem.group-id=io.casehub
quarkus.index-dependency.cbr-inmem.artifact-id=casehub-neocortex-memory-cbr-inmem
quarkus.index-dependency.support-core.group-id=io.casehub
quarkus.index-dependency.support-core.artifact-id=casehub-engine-support-core
quarkus.index-dependency.runtime-core.group-id=io.casehub
quarkus.index-dependency.runtime-core.artifact-id=casehub-engine-runtime-core

# Activate in-memory repositories and test overrides
quarkus.arc.selected-alternatives=\
  io.casehub.persistence.memory.InMemoryCaseMetaModelRepository,\
  io.casehub.persistence.memory.InMemoryCaseInstanceRepository,\
  io.casehub.persistence.memory.InMemoryEventLogRepository,\
  io.casehub.persistence.memory.InMemorySubCaseGroupRepository,\
  io.casehub.persistence.memory.InMemoryPlanItemStore,\
  io.casehub.neocortex.memory.cbr.inmem.InMemoryCbrCaseMemoryStore,\
  io.casehub.engine.agentic.IntegrationTestBeans

# Exclude beans not needed by engine-adapter tests
quarkus.arc.exclude-types=\
  io.casehub.work.core.strategy.RoundRobinStrategy,\
  io.casehub.platform.mock.MockCurrentPrincipal,\
  io.casehub.persistence.memory.quarkus.PersistenceMemoryBeans,\
  io.casehub.ledger.service.CaseLedgerEventCapture,\
  io.casehub.ledger.service.WorkerDecisionEventCapture,\
  io.casehub.blocks.BlocksBeans,\
  io.casehub.blocks.agentic.social.SocialCognitionDefaultBeans,\
  io.casehub.blocks.agentic.social.PersonalityEvolutionOrchestrator,\
  io.casehub.blocks.agentic.social.drive.DriveOrchestrator,\
  io.casehub.blocks.agentic.social.MoodOrchestrator,\
  io.casehub.blocks.agentic.social.InnerLifeOrchestrator,\
  io.casehub.blocks.agentic.social.UserModelOrchestrator,\
  io.casehub.blocks.agentic.social.MentalModelOrchestrator,\
  io.casehub.blocks.agentic.social.StrategyLearningOrchestrator,\
  io.casehub.blocks.agentic.social.narrative.NarrativeOrchestrator,\
  io.casehub.blocks.agentic.social.narrative.NarrativePipeline,\
  io.casehub.blocks.agentic.social.goal.GoalProposalOrchestrator,\
  io.casehub.blocks.agentic.social.emergence.SocialNormDetector,\
  io.casehub.blocks.agentic.social.emergence.CollectiveGoalFormation,\
  io.casehub.blocks.agentic.social.prompt.SocialAvatarCognition,\
  io.casehub.blocks.agentic.social.prompt.SocialPromptAssembler,\
  io.casehub.blocks.routing.agent.LlmAgentRoutingStrategy,\
  io.casehub.blocks.routing.agent.CbrAgentRoutingStrategy,\
  io.casehub.blocks.routing.agent.RoutingSupport,\
  io.casehub.blocks.channel.summary.ThreadSummaryObserver,\
  io.casehub.blocks.channel.summary.ChannelSummariser,\
  io.casehub.blocks.memory.MemoryHygieneOrchestrator,\
  io.casehub.blocks.memory.MemoryHygieneScheduler,\
  io.casehub.blocks.prompt.runtime.OptimisedFewShotSection,\
  io.casehub.blocks.prompt.runtime.VariantAwareSystemPromptCustomiser,\
  io.casehub.blocks.spring.BlocksAutoConfiguration,\
  io.casehub.connectors.twilio.TwilioSmsConnector

# Placeholder config for connector beans on the test classpath
casehub.connectors.twilio.account-sid=test
casehub.connectors.twilio.auth-token=test
casehub.connectors.twilio.from=+10000000000
casehub.connectors.whatsapp.api-token=test
casehub.connectors.whatsapp.phone-number-id=test
casehub.connectors.whatsapp.verify-token=test
casehub.connectors.slack.bot-token=test
casehub.connectors.slack.signing-secret=test
casehub.connectors.teams.app-id=test
casehub.connectors.teams.app-password=test

# H2 datasource for casehub-ledger JPA entities
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:agentictestdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.flyway.migrate-at-start=false

